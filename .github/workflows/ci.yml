name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Type check
        run: mypy src/fleetplane
      - name: Tests and coverage
        run: >-
          pytest
          --junitxml=evidence/pytest-junit.xml
          --cov=fleetplane
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:evidence/coverage.xml
      - name: Reference scenario
        run: >-
          fleetplane showcase
          --devices 20
          --restricted-devices 3
          --evidence evidence/ci-reference-scenario.json
      - name: Build wheel
        run: python -m build --wheel
      - name: Upload verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: fleetplane-verification-evidence
          path: |
            evidence/pytest-junit.xml
            evidence/coverage.xml
            evidence/ci-reference-scenario.json
            dist/*.whl
          if-no-files-found: error
